[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-grading-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "bcrypt>=5,<6",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
seed-demo = "scripts.seed_demo:main"

[tool.setuptools.packages.find]
include = ["app*", "fixtures*", "migrations*", "scripts*"]

[tool.setuptools.package-data]
migrations = ["script.py.mako"]
"fixtures.agent_outputs" = ["*.json"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.35",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../scripts"]
testpaths = ["tests", "../scripts/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
